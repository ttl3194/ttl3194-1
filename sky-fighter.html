<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>스카이 파이터</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{touch-action:none;display:block;box-shadow:0 0 40px #000}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const W = 480, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 사운드 ----------
let AC = null;
function beep(f, d, type = 'square', vol = 0.05, slide = 0) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  shoot: () => beep(880, 0.06, 'square', 0.02, -400),
  boom: () => beep(160, 0.3, 'sawtooth', 0.06, -120),
  hit: () => beep(300, 0.08, 'square', 0.03, -100),
  hurt: () => beep(120, 0.4, 'sawtooth', 0.09, -80),
  item: () => beep(600, 0.2, 'triangle', 0.06, 600),
  bomb: () => beep(90, 0.8, 'sawtooth', 0.12, -60),
};

// ---------- 입력 ----------
const keys = {};
const ptr = { down: false, x: W / 2, y: H - 100 };
addEventListener('keydown', e => {
  if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' || e.code === 'Space') { if (state !== 'play') start(); }
  if (e.code === 'KeyX' || e.code === 'KeyB') useBomb();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
});
addEventListener('keyup', e => keys[e.code] = false);
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  const p = toGame(e);
  if (state !== 'play') { start(); return; }
  if (Math.hypot(p.x - (W - 50), p.y - (H - 50)) < 38) { useBomb(); return; }
  ptr.down = true; ptr.x = p.x; ptr.y = p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (ptr.down) { const p = toGame(e); ptr.x = p.x; ptr.y = p.y; } });
cv.addEventListener('pointerup', () => ptr.down = false);
cv.addEventListener('pointercancel', () => ptr.down = false);

// ---------- 상태 ----------
let state = 'title', paused = false;
let P, bullets, ebullets, enemies, parts, items, stars, clouds;
let score = 0, stage = 1, spawned = 0, quota = 18, spawnT = 1, boss = null, shake = 0, banner = '', bannerT = 0, time = 0;
let best = 0;
try { best = +localStorage.getItem('skyfighter-best') || 0; } catch (_) {}

stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5 }));
clouds = Array.from({ length: 8 }, () => newCloud(Math.random() * H));
function newCloud(y) { return { x: Math.random() * W, y, w: 60 + Math.random() * 120, sp: 40 + Math.random() * 60, a: 0.08 + Math.random() * 0.15 }; }

function start() {
  P = { x: W / 2, y: H - 110, hp: 5, max: 5, w: 1, bombs: 2, inv: 1.5, cd: 0, r: 10 };
  bullets = []; ebullets = []; enemies = []; parts = []; items = [];
  score = 0; stage = 1; spawned = 0; quota = 18; spawnT = 1; boss = null; shake = 0; time = 0;
  showBanner('STAGE 1');
  state = 'play'; paused = false;
}
function showBanner(t) { banner = t; bannerT = 2.2; }

// ---------- 유틸 ----------
const rnd = (a, b) => a + Math.random() * (b - a);
function boom(x, y, n = 14, col = '#fa3', sp = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = rnd(30, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.8), max: 0.8, col: Math.random() < 0.5 ? col : '#ff6', size: rnd(2, 5) });
  }
}
function ebullet(x, y, ang, sp, r = 5) {
  ebullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r });
}
function aim(x, y) { return Math.atan2(P.y - y, P.x - x); }

// ---------- 적 ----------
const TYPES = {
  scout:  { hp: 1,  r: 14, s: 0.7, score: 100, body: '#e55', wing: '#933' },
  zig:    { hp: 2,  r: 16, s: 0.8, score: 200, body: '#e9a23b', wing: '#a5671a' },
  gunner: { hp: 4,  r: 18, s: 0.95, score: 350, body: '#a5e', wing: '#639' },
  bomber: { hp: 12, r: 32, s: 1.6, score: 800, body: '#7a8', wing: '#465' },
};
function spawnEnemy(type, x, y) {
  const t = TYPES[type];
  const hp = Math.ceil(t.hp * (1 + (stage - 1) * 0.25));
  enemies.push({ type, x, y, x0: x, hp, max: hp, r: t.r, age: 0, cd: rnd(0.5, 1.5), flash: 0, dir: Math.random() < 0.5 ? -1 : 1 });
}
function spawnWave() {
  const roll = Math.random();
  const lim = Math.min(stage, 4);
  if (roll < 0.35) {                       // 척후기 편대
    const n = 3 + Math.floor(Math.random() * 3), x = rnd(80, W - 80);
    for (let i = 0; i < n; i++) spawnEnemy('scout', x + (i - (n - 1) / 2) * 50, -30 - Math.abs(i - n / 2) * 25);
    spawned += n;
  } else if (roll < 0.6) {
    spawnEnemy('zig', rnd(100, W - 100), -30); spawned++;
  } else if (roll < 0.85 || lim < 2) {
    spawnEnemy(lim >= 2 ? 'gunner' : 'zig', rnd(80, W - 80), -30); spawned++;
  } else {
    spawnEnemy('bomber', rnd(100, W - 100), -50); spawned += 2;
  }
}
function spawnBoss() {
  const hp = 70 + stage * 40;
  boss = { type: 'boss', x: W / 2, y: -90, hp, max: hp, r: 52, age: 0, cd: 2, flash: 0, atk: 0 };
  enemies.push(boss);
  showBanner('WARNING!');
  sfx.hurt();
}

// ---------- 플레이어 ----------
function shoot() {
  const w = P.w, x = P.x, y = P.y - 22;
  const add = (dx, ang) => bullets.push({ x: x + dx, y, vx: Math.sin(ang) * 700, vy: -Math.cos(ang) * 700, r: 4 });
  if (w === 1) add(0, 0);
  else if (w === 2) { add(-9, 0); add(9, 0); }
  else if (w === 3) { add(0, 0); add(-12, -0.12); add(12, 0.12); }
  else { add(-8, 0); add(8, 0); add(-16, -0.2); add(16, 0.2); add(0, 0); }
  P.cd = w >= 4 ? 0.12 : 0.15;
  sfx.shoot();
}
function useBomb() {
  if (state !== 'play' || paused || P.bombs <= 0) return;
  P.bombs--; sfx.bomb(); shake = 0.6;
  ebullets.forEach(b => boom(b.x, b.y, 3, '#9cf', 80));
  ebullets.length = 0;
  enemies.forEach(e => damageEnemy(e, e.type === 'boss' ? 25 : 50));
  P.inv = Math.max(P.inv, 1);
  for (let i = 0; i < 40; i++) boom(rnd(0, W), rnd(0, H), 1, '#9cf', 300);
}
function hurtPlayer() {
  if (P.inv > 0) return;
  P.hp--; P.inv = 1.8; shake = 0.4; sfx.hurt();
  P.w = Math.max(1, P.w - 1);
  boom(P.x, P.y, 20, '#f84');
  if (P.hp <= 0) gameOver();
}
function gameOver() {
  boom(P.x, P.y, 60, '#f84', 380);
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('skyfighter-best', best); } catch (_) {} }
}

function damageEnemy(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flash = 0.08;
  if (e.hp > 0) { sfx.hit(); return; }
  e.dead = true;
  const t = TYPES[e.type];
  sfx.boom();
  if (e.type === 'boss') {
    score += 2000 * stage; shake = 1;
    for (let i = 0; i < 12; i++) setTimeout(() => state === 'play' && boom(e.x + rnd(-50, 50), e.y + rnd(-40, 40), 25, '#fa3', 320), i * 90);
    ebullets.length = 0;
    items.push({ x: e.x - 30, y: e.y, k: 'P' }, { x: e.x, y: e.y, k: 'H' }, { x: e.x + 30, y: e.y, k: 'B' });
    boss = null; stage++; spawned = 0; quota = 18 + stage * 4; spawnT = 3;
    setTimeout(() => state === 'play' && showBanner('STAGE ' + stage), 1500);
  } else {
    score += t.score; boom(e.x, e.y, e.type === 'bomber' ? 35 : 14);
    if (Math.random() < (e.type === 'bomber' ? 0.7 : 0.1)) {
      const r = Math.random();
      items.push({ x: e.x, y: e.y, k: r < 0.5 ? 'P' : r < 0.8 ? 'H' : 'B' });
    }
  }
}

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  if (bannerT > 0) bannerT -= dt;
  if (shake > 0) shake -= dt;

  // 플레이어
  if (state === 'play') {
    const sp = 320;
    let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    P.x += dx * sp * dt; P.y += dy * sp * dt;
    if (ptr.down) {
      const k = Math.min(1, 14 * dt);
      P.x += (ptr.x - P.x) * k; P.y += (ptr.y - 70 - P.y) * k;
    }
    P.x = Math.max(24, Math.min(W - 24, P.x));
    P.y = Math.max(40, Math.min(H - 40, P.y));
    if (P.inv > 0) P.inv -= dt;
    P.cd -= dt;
    if ((keys.Space || keys.KeyZ || ptr.down) && P.cd <= 0) shoot();
  }

  // 스폰
  if (state === 'play' && !boss) {
    spawnT -= dt;
    if (spawnT <= 0) {
      if (spawned >= quota) { if (!enemies.length) spawnBoss(); spawnT = 0.5; }
      else { spawnWave(); spawnT = Math.max(0.6, 1.5 - stage * 0.12); }
    }
  }

  // 총알
  bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);
  ebullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  ebullets = ebullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // 적
  const alive = state === 'play';
  for (const e of enemies) {
    e.age += dt; e.cd -= dt; if (e.flash > 0) e.flash -= dt;
    switch (e.type) {
      case 'scout':
        e.y += (120 + stage * 8) * dt; e.x = e.x0 + Math.sin(e.age * 2) * 30; break;
      case 'zig':
        e.y += 110 * dt; e.x = e.x0 + Math.sin(e.age * 3) * 90;
        if (e.cd <= 0 && alive && e.y > 0 && e.y < H - 200) { ebullet(e.x, e.y + 10, Math.PI / 2, 190); e.cd = 1.6; }
        break;
      case 'gunner':
        if (e.age < 8 && e.y < 140) e.y += 140 * dt;
        else if (e.age < 8) { e.x += e.dir * 70 * dt; if (e.x < 50 || e.x > W - 50) e.dir *= -1; }
        else e.y += 150 * dt;
        if (e.cd <= 0 && alive && e.y > 0) { ebullet(e.x, e.y + 12, aim(e.x, e.y), 230); e.cd = Math.max(0.8, 1.5 - stage * 0.08); }
        break;
      case 'bomber':
        e.y += 45 * dt; e.x = e.x0 + Math.sin(e.age) * 50;
        if (e.cd <= 0 && alive && e.y > 0) {
          const a = aim(e.x, e.y);
          for (let i = -2; i <= 2; i++) ebullet(e.x, e.y + 20, a + i * 0.2, 200);
          e.cd = 1.8;
        }
        break;
      case 'boss': bossAI(e, dt, alive); break;
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 80);
  if (boss && boss.dead) boss = null;

  // 충돌
  if (state === 'play') {
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.dead || b.dead) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) { b.dead = true; damageEnemy(e, 1); boom(b.x, b.y, 2, '#ff8', 80); }
      }
    }
    bullets = bullets.filter(b => !b.dead);
    for (const b of ebullets) {
      if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + P.r * 0.6) { b.dead = true; hurtPlayer(); }
    }
    ebullets = ebullets.filter(b => !b.dead);
    for (const e of enemies) {
      if (!e.dead && Math.hypot(e.x - P.x, e.y - P.y) < e.r + P.r) {
        if (e.type !== 'boss') damageEnemy(e, 99);
        hurtPlayer();
      }
    }
    for (const it of items) {
      it.y += 70 * dt;
      if (Math.hypot(it.x - P.x, it.y - P.y) < 28) {
        it.dead = true; sfx.item(); score += 50;
        if (it.k === 'P') P.w = Math.min(4, P.w + 1);
        else if (it.k === 'H') P.hp = Math.min(P.max, P.hp + 1);
        else P.bombs = Math.min(5, P.bombs + 1);
      }
    }
    items = items.filter(i => !i.dead && i.y < H + 20);
  }

  // 파티클·배경
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
  stars.forEach(s => { s.y += s.s * 60 * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
  clouds.forEach((c, i) => { c.y += c.sp * dt; if (c.y > H + 40) clouds[i] = newCloud(-40); });
}

function bossAI(e, dt, alive) {
  if (e.y < 120) { e.y += 80 * dt; return; }
  e.x = W / 2 + Math.sin(e.age * 0.7) * 150;
  if (!alive || e.cd > 0) return;
  const rage = e.hp / e.max < 0.5;
  const a = aim(e.x, e.y);
  switch (e.atk++ % 3) {
    case 0: // 부채꼴
      for (let i = -4; i <= 4; i++) ebullet(e.x, e.y + 40, Math.PI / 2 + i * 0.16, 190);
      e.cd = rage ? 0.8 : 1.2; break;
    case 1: // 조준 연사
      for (let i = 0; i < (rage ? 5 : 3); i++) setTimeout(() => state === 'play' && boss && ebullet(boss.x, boss.y + 40, aim(boss.x, boss.y), 280), i * 120);
      e.cd = rage ? 1 : 1.4; break;
    case 2: // 원형
      const n = rage ? 24 : 16, off = Math.random();
      for (let i = 0; i < n; i++) ebullet(e.x, e.y + 20, off + i / n * 6.283, 160);
      e.cd = rage ? 1 : 1.5; break;
  }
}

// ---------- 그리기 ----------
function plane(x, y, s, body, wing, flip, flash) {
  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.rotate(Math.PI);
  ctx.scale(s, s);
  ctx.fillStyle = flash ? '#fff' : wing;
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(30, 16); ctx.lineTo(30, 22); ctx.lineTo(8, 14);
  ctx.lineTo(6, 26); ctx.lineTo(-6, 26); ctx.lineTo(-8, 14); ctx.lineTo(-30, 22);
  ctx.lineTo(-30, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = flash ? '#fff' : body;
  ctx.beginPath();
  ctx.moveTo(0, -30); ctx.quadraticCurveTo(9, -8, 7, 22); ctx.lineTo(-7, 22);
  ctx.quadraticCurveTo(-9, -8, 0, -30); ctx.fill();
  ctx.fillStyle = '#9ef';
  ctx.beginPath(); ctx.ellipse(0, -8, 3.5, 8, 0, 0, 7); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 14, rnd(-1, 1) * shake * 14);

  // 하늘
  const hue = (210 + (stage - 1) * 35) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},60%,12%)`); g.addColorStop(1, `hsl(${hue},55%,32%)`);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#fff';
  stars.forEach(s => { ctx.globalAlpha = 0.3 + s.s * 0.2; ctx.fillRect(s.x, s.y, s.s, s.s); });
  clouds.forEach(c => {
    ctx.globalAlpha = c.a; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w, c.w * 0.25, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x + c.w * 0.4, c.y - 8, c.w * 0.6, c.w * 0.2, 0, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (state !== 'title') {
    // 아이템
    items.forEach(it => {
      const col = it.k === 'P' ? '#fd3' : it.k === 'H' ? '#4d6' : '#f55';
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(it.x, it.y, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(it.k, it.x, it.y + 5);
    });
    // 적
    enemies.forEach(e => {
      if (e.type === 'boss') plane(e.x, e.y, 3.2, '#c33', '#612', true, e.flash > 0);
      else { const t = TYPES[e.type]; plane(e.x, e.y, t.s, t.body, t.wing, true, e.flash > 0); }
      if (e.type === 'bomber' || e.type === 'gunner') {
        ctx.fillStyle = '#0008'; ctx.fillRect(e.x - 18, e.y - e.r - 10, 36, 4);
        ctx.fillStyle = '#f66'; ctx.fillRect(e.x - 18, e.y - e.r - 10, 36 * e.hp / e.max, 4);
      }
    });
    // 총알
    ctx.fillStyle = '#6ff';
    bullets.forEach(b => { ctx.shadowColor = '#6ff'; ctx.shadowBlur = 8; ctx.fillRect(b.x - 2, b.y - 8, 4, 14); });
    ctx.shadowBlur = 0;
    ebullets.forEach(b => {
      ctx.fillStyle = '#f46'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#fcd'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, 7); ctx.fill();
    });
    // 플레이어
    if (state === 'play' && (P.inv <= 0 || Math.floor(time * 20) % 2)) {
      const fl = 10 + Math.random() * 10;
      ctx.fillStyle = '#fa3'; ctx.beginPath();
      ctx.moveTo(P.x - 4, P.y + 24); ctx.lineTo(P.x, P.y + 24 + fl); ctx.lineTo(P.x + 4, P.y + 24); ctx.fill();
      plane(P.x, P.y, 0.95, '#4af', '#27c', false, false);
    }
    // 파티클
    parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.textAlign = 'left';
  if (state === 'play' || state === 'over') hud();
  if (bannerT > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, bannerT);
    ctx.fillStyle = banner === 'WARNING!' ? '#f44' : '#fff';
    ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(banner, W / 2, H / 3);
    ctx.globalAlpha = 1;
  }
  if (paused) overlay('일시정지', 'P 키로 계속');
  if (state === 'title') {
    overlay('SKY FIGHTER', '클릭 / Enter 로 시작');
    ctx.fillStyle = '#cde'; ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('이동: 방향키 / WASD    발사: Space (누르고 있기)', W / 2, H / 2 + 70);
    ctx.fillText('폭탄: X    일시정지: P    터치: 드래그로 이동 + 자동 발사', W / 2, H / 2 + 94);
    ctx.fillText('P = 무기 강화   H = 체력 회복   B = 폭탄', W / 2, H / 2 + 118);
    if (best) ctx.fillText('최고 점수 ' + best, W / 2, H / 2 + 160);
  }
  if (state === 'over') {
    overlay('GAME OVER', `점수 ${score}  ·  최고 ${best}`, '클릭 / Enter 로 다시 시작');
  }
}
function overlay(title, sub, sub2) {
  ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px sans-serif'; ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#9df'; ctx.fillText(sub, W / 2, H / 2 + 20);
  if (sub2) { ctx.fillStyle = '#fff'; ctx.fillText(sub2, W / 2, H / 2 + 52); }
}
function hud() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 14, 30);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#9df';
  ctx.fillText('STAGE ' + stage + '   무기 Lv.' + (P ? P.w : 1), 14, 50);
  for (let i = 0; i < P.max; i++) {
    ctx.fillStyle = i < P.hp ? '#f55' : '#ffffff30';
    ctx.fillRect(14 + i * 22, 60, 18, 8);
  }
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.font = '14px sans-serif';
  ctx.fillText('BEST ' + best, W - 14, 26);
  if (boss) {
    ctx.fillStyle = '#0008'; ctx.fillRect(100, 78, W - 200, 8);
    ctx.fillStyle = '#f44'; ctx.fillRect(100, 78, (W - 200) * Math.max(0, boss.hp) / boss.max, 8);
  }
  // 폭탄 버튼
  ctx.fillStyle = '#f553'; ctx.beginPath(); ctx.arc(W - 50, H - 50, 32, 0, 7); ctx.fill();
  ctx.strokeStyle = '#f88'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText('BOMB', W - 50, H - 52); ctx.fillText('x' + P.bombs, W - 50, H - 36);
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(loop);
  if (!paused) {
    if (state === 'title') { stars.forEach(s => { s.y += s.s * 60 * dt; if (s.y > H) s.y = 0; }); clouds.forEach((c, i) => { c.y += c.sp * dt; if (c.y > H + 40) clouds[i] = newCloud(-40); }); time += dt; }
    else update(dt);
  }
  draw();
}
requestAnimationFrame(loop);
</script>
